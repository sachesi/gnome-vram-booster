[package]
name = "gnome-vram-booster"
version = "0.7.1"
edition = "2024"
# let-chains, stable since 1.88
rust-version = "1.88"
authors = ["sachesi <xsachesi@pm.me>"]
description = "GNOME daemon for dynamic VRAM prioritization via dmem cgroups"
license = "GPL-3.0-or-later"

[[bin]]
name = "gnome-vram-booster"
path = "src/main.rs"

[[bin]]
name = "gnome-vram-boosterctl"
path = "src/ctl.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
zvariant = "5"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
