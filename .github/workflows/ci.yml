name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just glib2
      - uses: actions/checkout@v5
      - name: Lint and test
        run: just check

  aur:
    name: AUR
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/aur.yml
